name: pr

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  # Title and body edits run in their own lane. They skip every job but commitlint, so sharing a
  # lane would let one cancel a running full check and leave the pull request with nothing that
  # passed. Retargeting the base is not one of those: it re-runs everything, in the content lane.
  group: pr-${{ github.workflow }}-${{ github.ref }}-${{ (github.event.action == 'edited' && github.event.changes.base == null) && 'title' || 'content' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  biome:
    name: 1 - biome
    runs-on: ubuntu-latest
    if: ${{ github.event.action != 'edited' || github.event.changes.base != null }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck-build:
    name: 2 - typecheck + build + knip
    runs-on: ubuntu-latest
    if: ${{ github.event.action != 'edited' || github.event.changes.base != null }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm knip

  test:
    name: 3 - test
    runs-on: ubuntu-latest
    if: ${{ github.event.action != 'edited' || github.event.changes.base != null }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm test

  test-node-floor:
    name: 3 - test (node 24.15.0)
    runs-on: ubuntu-latest
    if: ${{ github.event.action != 'edited' || github.event.changes.base != null }}
    # engines.node says >=24.15.0, so the floor gets the same test run as .nvmrc does.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          node-version: 24.15.0
      - run: pnpm test
      - run: pnpm build

  commitlint:
    name: 4 - commitlint
    runs-on: ubuntu-latest
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Lint PR commit range
        if: ${{ github.event.action != 'edited' || github.event.changes.base != null }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          pnpm exec commitlint --verbose
          --from "$BASE_SHA"
          --to "$HEAD_SHA"
      - name: Lint PR title
        run: printf '%s' "$PR_TITLE" | pnpm exec commitlint --verbose

  gitleaks:
    name: 5 - gitleaks
    runs-on: ubuntu-latest
    if: ${{ github.event.action != 'edited' || github.event.changes.base != null }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan git history for secrets
        run: |
          set -euo pipefail
          ./scripts/install-gitleaks.sh
          ./bin/gitleaks git --redact --verbose --exit-code 1 .
